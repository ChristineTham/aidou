project:
  type: book
  output-dir: _book
  # After render, append a content-hash query to the PDF/ePub download links
  # so a redeploy always yields a fresh URL (defeats browser/CDN caching of a
  # stale file). See .claude/skills/book-build/scripts/cachebust.py.
  post-render:
    # Repair Quarto's malformed Mermaid <figure> markup so the ePub is valid XHTML.
    - python3 ../.claude/skills/book-build/scripts/epub_fix.py
    # Inject a back-cover page at the end of the ePub spine.
    - python3 ../.claude/skills/book-build/scripts/epub_backcover.py
    - python3 ../.claude/skills/book-build/scripts/cachebust.py

book:
  title: "AI-dō"
  subtitle: "The Way of AI, grounded in practice (道)"
  author: "Chris Tham"
  site-url: "https://christinetham.github.io/aidou/"
  repo-url: "https://github.com/ChristineTham/aidou"
  cover-image: cover.png
  cover-image-alt: "AI-dō — The Way of AI, grounded in practice (道), by Chris Tham"
  output-file: "ai-do"
  search: true
  sidebar:
    style: docked
    tools:
      - icon: file-pdf-fill
        text: "Download PDF"
        href: ai-do.pdf
      - icon: book-half
        text: "Download ePub"
        href: ai-do.epub
      - icon: github
        href: "https://github.com/ChristineTham/aidou"
  page-footer:
    left: "© Chris Tham"
    right: "Built with Quarto from one Markdown source."
  chapters:
    - index.qmd
    - preface.qmd
    - foundations.qmd
    - productivity.qmd
    - software-development.qmd
    - engineering-disciplines.qmd
    - governance.qmd
    - mastery.qmd

format:
  html:
    theme: brand.scss          # Rosely palette + Spectral come from _brand.yml
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-copy: true
    link-external-newwindow: true
    mermaid:
      theme: neutral
  typst:
    toc: true
    number-sections: true
    # Page size, margins, and the cover are set in typst-show.typ (orange-book's
    # book() takes them there — Quarto doesn't pass them through otherwise).
    template-partials:
      - typst-show.typ
    include-in-header: typst-fonts.typ     # body serif + fit diagrams to the page
    include-after-body: typst-back-cover.typ   # designed back-cover page (blurb)
    # Colours + Spectral come from _brand.yml. Mermaid -> PNG: Quarto doesn't
    # expose Mermaid's htmlLabels:false, so its SVG carries HTML (foreignObject)
    # labels Typst can't render; PNG is reliable and high quality.
  epub:
    toc: true
    number-sections: true
    css: epub.css
    # Blurb shown as the ebook description in readers' library/info (the
    # ePub-native "back cover"); a visible back-cover page is injected by the
    # epub_backcover.py post-render step.
    description: >-
      A structured, human-centred way of working with AI — method over model,
      discipline over hacks, augmentation not replacement. A short, first-person,
      primary-sourced practice guide, not a bag of prompts.
