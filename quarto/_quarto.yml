project:
  type: book
  output-dir: _book
  # Copy the social-share image (from images/, via build_site.py) into the site
  # so og:image / twitter:image (in _seo.html) resolve.
  resources:
    - ogimage.jpg
  # After render, append a content-hash query to the PDF/ePub download links
  # so a redeploy always yields a fresh URL (defeats browser/CDN caching of a
  # stale file). See .agents/skills/book-build/scripts/cachebust.py.
  post-render:
    # Repair Quarto's malformed Mermaid <figure> markup so the ePub is valid XHTML.
    - python3 ../.agents/skills/book-build/scripts/epub_fix.py
    # Inject a back-cover page at the end of the ePub spine.
    - python3 ../.agents/skills/book-build/scripts/epub_backcover.py
    # Add List of Figures / Diagrams / Tables pages after the Contents.
    - python3 ../.agents/skills/book-build/scripts/epub_lists.py
    # Self-referencing canonical on each page + canonical home URL in sitemap.xml.
    - python3 ../.agents/skills/book-build/scripts/seo_canonical.py
    - python3 ../.agents/skills/book-build/scripts/cachebust.py

book:
  title: "AI-dō"
  subtitle: "The Way of AI, grounded in practice (道)"
  author: "Chris Tham"
  site-url: "https://christham.net/aidou/"   # custom domain — canonical + sitemap
  repo-url: "https://github.com/ChristineTham/aidou"
  cover-image: cover.png
  cover-image-alt: "AI-dō — The Way of AI, grounded in practice (道), by Chris Tham"
  output-file: "ai-do"
  search: true
  sidebar:
    style: docked
    tools:
      # The GitHub icon is added automatically from `repo-url` above (as a
      # labelled "Source Code" link); don't add a second one here.
      - icon: file-pdf-fill
        text: "Download PDF"
        href: ai-do.pdf
      - icon: book-half
        text: "Download ePub"
        href: ai-do.epub
  page-footer:
    left: "© Chris Tham"
    right: "Built with Quarto from one Markdown source."
  chapters:
    - index.qmd
    - preface.qmd
    - foundations.qmd
    - productivity.qmd
    - software.qmd
    - disciplines.qmd
    - governance.qmd
    - mastery.qmd
    - changelog.qmd
    - index-of-terms.qmd

crossref:
  # Figures (images) and tables use Quarto's native numbering; Mermaid diagrams
  # are a separate custom float type so they number independently as "Diagram N"
  # and get their own list. build_site.py labels each element (fig-/tbl-/dia-).
  fig-title: "Figure"
  tbl-title: "Table"
  custom:
    - kind: float
      key: dia
      reference-prefix: "Diagram"

format:
  html:
    theme: [_tokens.scss, brand.scss]   # tokens (from theme.yml) + polish rules
    include-in-header: _seo.html        # SEO/OG/Twitter/JSON-LD (from gen_blurb.py)
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-copy: true
    link-external-newwindow: true
    # Mermaid theming is injected per-diagram (a Rosely-palette %%{init}%%
    # directive from build_site.py) so HTML, PDF, and ePub all match.
  typst:
    toc: true
    number-sections: true
    # Page size, margins, and the cover are set in typst-show.typ (orange-book's
    # book() takes them there — Quarto doesn't pass them through otherwise).
    template-partials:
      - typst-show.typ
    include-in-header: typst-fonts.typ     # body serif + fit diagrams to the page
    include-before-body: typst-lists.typ   # lists of Figures / Diagrams / Tables (after Contents)
    include-after-body: typst-back-cover.typ   # designed back-cover page (blurb)
    # Colours + Spectral come from _brand.yml. Mermaid -> PNG: Quarto doesn't
    # expose Mermaid's htmlLabels:false, so its SVG carries HTML (foreignObject)
    # labels Typst can't render; PNG is reliable and high quality.
  epub:
    toc: true
    number-sections: true
    css: [_tokens.css, epub.css]   # :root tokens (from theme.yml) + ePub rules
    # The ePub description (reader-library blurb) and the visible back-cover
    # page are both set by the epub_backcover.py post-render step, from the
    # single source blurb.json.
