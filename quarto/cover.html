<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  .cover {
    box-sizing: border-box;
    width: 100vw; height: 100vh;
    background: linear-gradient(160deg, #0f1b2d 0%, #16324f 55%, #1f6feb 140%);
    color: #f5f7fa;
    font-family: "Georgia", serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 9vh 8vw;
    position: relative; overflow: hidden;
  }
  .kanji {
    position: absolute; right: -4vw; bottom: -6vh;
    font-size: 62vh; line-height: 1; color: rgba(255,255,255,0.06);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; user-select: none;
  }
  .top { position: relative; }
  .eyebrow {
    font-family: "Helvetica Neue", sans-serif; letter-spacing: 0.35em;
    text-transform: uppercase; font-size: 2.4vh; color: #9db8de; margin: 0 0 2vh;
  }
  h1 {
    font-size: 15vh; margin: 0; line-height: 0.98; letter-spacing: -0.02em;
    font-weight: 700;
  }
  .sub {
    font-size: 4vh; margin: 3vh 0 0; max-width: 78%; color: #dbe6f5;
    font-style: italic; line-height: 1.3;
  }
  .rule { width: 12vw; height: 4px; background: #1f6feb; margin: 4vh 0 0; }
  .bottom { position: relative; font-family: "Helvetica Neue", sans-serif; }
  .author { font-size: 3.4vh; margin: 0; font-weight: 600; }
  .imprint { font-size: 2.2vh; margin: 1vh 0 0; color: #9db8de; letter-spacing: 0.05em; }
</style>
</head>
<body>
  <div class="cover">
    <div class="kanji">道</div>
    <div class="top">
      <p class="eyebrow">A disciplined way of working with AI</p>
      <h1>AI-dō</h1>
      <p class="sub">The Way of AI — guided by love (愛), grounded in practice (道)</p>
      <div class="rule"></div>
    </div>
    <div class="bottom">
      <p class="author">Chris Tham</p>
      <p class="imprint">愛 · 道 &nbsp;|&nbsp; Method over model</p>
    </div>
  </div>
</body>
</html>
