name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install a CJK font (for the 愛 / 道 kanji in the PDF)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Set up Python (for the book -> Quarto generator)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Quarto (bundles Typst for the PDF)
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install headless Chrome (for Mermaid diagram rendering)
        run: quarto install chrome-headless-shell

      - name: Generate Quarto chapters from book/*.md (single source)
        working-directory: quarto
        run: python3 ../.claude/skills/book-build/scripts/build_site.py --book ../book --out .

      - name: Render HTML + PDF + ePub
        working-directory: quarto
        env:
          TYPST_FONT_PATHS: fonts   # bundled Spectral fonts for the Typst PDF
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quarto/_book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
