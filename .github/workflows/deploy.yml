name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install a CJK font (for the 愛 / 道 kanji in the PDF)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Set up Python (for the book -> Quarto generator)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Quarto (bundles Typst for the PDF)
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install headless Chrome (for Mermaid diagram rendering)
        run: quarto install chrome-headless-shell

      - name: Generate design tokens from theme.yml (single source)
        working-directory: quarto
        run: python3 ../.claude/skills/book-build/scripts/gen_theme.py .

      - name: Generate Quarto chapters from book/*.md (single source)
        working-directory: quarto
        run: python3 ../.claude/skills/book-build/scripts/build_site.py --book ../book --out .

      - name: Generate landing partials from book/blurb.md + book/epigraph.md
        working-directory: quarto
        run: python3 ../.claude/skills/book-build/scripts/gen_blurb.py .

      - name: Render HTML + PDF + ePub
        working-directory: quarto
        env:
          TYPST_FONT_PATHS: fonts   # bundled Spectral fonts for the Typst PDF
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: quarto/_book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      # The GitHub Pages backend intermittently returns "Deployment failed, try
      # again later" on the first status poll — a known, unresolved service-side
      # flake (actions/deploy-pages#406, #418). The build artifact is fine; a
      # re-run succeeds. So try once, and if the backend rejects it, retry.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Retry deploy (Pages backend flake)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
